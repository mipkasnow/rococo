name: rococo-minio

services:
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: rococo-minio
    command: [ "server", "/data", "--console-address", ":9001" ]
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password
    volumes:
      - rococo-minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  createbuckets:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 user password
        mc mb --ignore-existing local/painting
        mc mb --ignore-existing local/museum
        mc mb --ignore-existing local/artist
        mc mb --ignore-existing local/avatar

volumes:
  rococo-minio:
    name: rococo-minio
